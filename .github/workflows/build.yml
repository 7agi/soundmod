name: Build SoundMod

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages (WebView2 SDK + WIL)
        # `nuget restore` (packages.config + msbuild project restore) doesn't
        # support -ExcludeVersion. `nuget install` does, and is the right verb
        # here since we're not restoring an msbuild project - just fetching
        # the packages onto disk with folder names CMakeLists.txt expects.
        run: nuget install packages.config -OutputDirectory packages -ExcludeVersion

      - name: Configure CMake
        # Ninja + the cl.exe put on PATH by msvc-dev-cmd, instead of pinning a
        # specific "Visual Studio NN YYYY" generator name that breaks whenever
        # GitHub bumps the VS version bundled in windows-latest.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --parallel

      - name: Stage output
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\SoundMod.exe dist\
          Copy-Item packages\Microsoft.Web.WebView2\build\native\x64\WebView2Loader.dll dist\
          New-Item -ItemType Directory -Force -Path dist\soundpacks\default
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundMod-windows-x64
          path: dist/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoundMod.exe
            dist/WebView2Loader.dll
          generate_release_notes: true
